name: Bug report
description: A component doesn't behave the way the demo or the original project shows.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: The details below let the maintainer rebuild your setup in a fresh app. For a security problem, use a private report instead.
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: select
    validations:
      required: true
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: The steps, and what you see. A screen recording helps for anything that moves.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: A link to the same component in the original project helps when the port differs from it.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: From your package.json, or `npm ls @angel-r/fluid-functionalism-angular @angular/core @angular/cdk tailwindcss`.
      value: |
        @angel-r/fluid-functionalism-angular:
        @angular/core:
        @angular/cdk:
        tailwindcss:
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 26, macOS 26
  - type: input
    id: reproduction
    attributes:
      label: Reproduction
      description: A repo or a StackBlitz link. Optional, and the fastest way to a fix.
