name: Idea
description: A component, a prop, or a behavior you'd like.
labels: [enhancement]
body:
  - type: textarea
    id: building
    attributes:
      label: What you're building
      description: The screen or the flow, and where the Angular port falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it would work. A sketch or a link to a product that does it helps.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to open the pull request once the direction is agreed.
