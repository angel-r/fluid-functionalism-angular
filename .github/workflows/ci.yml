name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: angular/package-lock.json
      - run: npm ci
      - name: Test the library
        run: npx ng test fluid-functionalism --watch=false
      - name: Build the library
        run: npx ng build fluid-functionalism
      - name: Build the showcase
        run: npx ng build showcase
