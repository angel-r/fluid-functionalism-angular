version: 2
updates:
  # Security updates only, grouped into one pull request, for the Angular
  # workspace. The limit of 0 turns version updates off. The React project at
  # the root follows upstream and gets its updates through the upstream sync.
  - package-ecosystem: npm
    directory: /angular
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
