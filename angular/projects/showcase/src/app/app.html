<div class="flex min-h-screen">
  <aside class="sticky top-0 flex h-screen w-60 shrink-0 flex-col gap-6 border-r border-border p-4">
    <div class="text-site-subtitle font-medium text-foreground">Fluid Functionalism<span class="text-muted-foreground"> · Angular</span></div>
    <nav class="flex flex-col gap-4 overflow-y-auto">
      @for (g of groups(); track g.group) {
        <div class="flex flex-col gap-0.5">
          <div class="px-2 pb-1 text-site-caption text-muted-foreground">{{ g.group }}</div>
          @for (demo of g.items; track demo.slug) {
            <a
              [routerLink]="demo.slug"
              routerLinkActive="bg-hover text-foreground"
              class="rounded-lg px-2 py-1.5 text-site-body text-muted-foreground hover:text-foreground"
            >{{ demo.title }}</a>
          }
        </div>
      }
    </nav>
    <div class="mt-auto flex flex-col gap-1 text-site-caption text-muted-foreground">
      <button type="button" class="text-left hover:text-foreground" (click)="theme.cycle()">Theme: {{ theme.theme() }} (T)</button>
      <button type="button" class="text-left hover:text-foreground" (click)="shape.setShape(shape.shape() === 'rounded' ? 'pill' : 'rounded')">Shape: {{ shape.shape() }}</button>
      <button type="button" class="text-left hover:text-foreground" (click)="size.setSize(size.size() === 'default' ? 'compact' : 'default')">Size: {{ size.size() }}</button>
    </div>
  </aside>
  <main class="min-w-0 flex-1 px-10 py-10">
    <router-outlet />
  </main>
</div>
