<!-- ⌘K anywhere: every page and setting in one field. -->
<app-site-command-menu />
<app-google-font-picker />

<ff-sidebar-provider
  [class]="providerClass"
  [mobileBreakpoint]="mobileBreakpoint"
  [shortcut]="shortcut()"
  [defaultOpen]="defaultOpen"
>
  <app-shell-navigation />

  @if (location.shell()) {
    <app-site-sidebar />

    <!-- Mobile trigger for the sheet; desktop collapse uses [ or the rail. -->
    <ff-sidebar-trigger [class]="'xl:hidden fixed top-4 left-4 z-50'" />
    <app-desktop-reopen-trigger />
    <app-sidebar-shortcut-toast />
  }

  <!-- Main content -->
  <main ffSidebarInset [class]="'min-w-0'">
    <router-outlet />
  </main>

  @if (location.shell()) {
    <!-- Desktop right panel -->
    <div class="contents" data-site-right-panel>
      <app-right-panel />
    </div>
  }
</ff-sidebar-provider>
